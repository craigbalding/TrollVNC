name: Build hardened rootless TrollVNC

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build-rootless:
    runs-on: macos-14

    steps:
      - name: Checkout TrollVNC
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install ldid-procursus make

      - name: Checkout pinned roothide/theos
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: roothide/theos
          ref: 88506b2c22e9e07dd4ed055f23c9e398a117a2c7
          path: theos-roothide
          submodules: recursive
          persist-credentials: false

      - name: Install pinned iOS 16.5 SDK asset
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos-roothide"
          mkdir -p "$THEOS/sdks"
          curl --fail --location --proto '=https' --tlsv1.2 \
            'https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz' \
            --output "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"
          shasum -a 256 "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" | tee -a "$GITHUB_STEP_SUMMARY"
          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '16.2'

      - name: Generate hardened managed configuration
        env:
          TVNC_ENABLED: 'true'
          TVNC_DESKTOP_NAME: 'iPhone-XR'
          TVNC_BIND_HOST: '127.0.0.1'
          TVNC_PORT: '5901'
          TVNC_VIEW_ONLY: 'false'
          TVNC_CLIPBOARD_ENABLED: 'true'
          TVNC_KEEPALIVE_SEC: '60'
          TVNC_SCALE: '1.0'
          TVNC_FRAME_RATE_SPEC: '30'
          TVNC_MODIFIER_MAP: 'std'
          TVNC_ORIENTATION_SYNC: 'true'
          TVNC_NATURAL_SCROLL: 'false'
          TVNC_AUTO_ASSIST_ENABLED: 'false'
          TVNC_SERVER_CURSOR: 'false'
          TVNC_BONJOUR_ENABLED: 'false'
          TVNC_KEY_LOGGING: 'false'
          TVNC_HTTP_PORT: '0'
          TVNC_REVERSE_MODE: 'none'
        run: |
          set -euo pipefail
          bash devkit/gen-managed-plist.sh
          plutil -lint prefs/TrollVNCPrefs/Resources/Managed.plist
          plutil -p prefs/TrollVNCPrefs/Resources/Managed.plist
          grep -q '<string>127.0.0.1</string>' prefs/TrollVNCPrefs/Resources/Managed.plist
          grep -q '<integer>5901</integer>' prefs/TrollVNCPrefs/Resources/Managed.plist
          ! grep -q 'FullPassword' prefs/TrollVNCPrefs/Resources/Managed.plist

      - name: Apply single-family bind fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("src/trollvncserver.mm")
          s = p.read_text()

          line_v4 = "        gScreen->listenInterface = v4Addr;\n"
          if s.count(line_v4) != 1:
              raise SystemExit("IPv4 bind assignment not found exactly once")
          s = s.replace(
              line_v4,
              line_v4 + "        gScreen->ipv6port = 0; // explicit IPv4 bind: disable the IPv6 listener\n",
              1,
          )

          line_v6 = "        gScreen->listen6Interface = strdup(iface);\n"
          if s.count(line_v6) != 1:
              raise SystemExit("IPv6 bind assignment not found exactly once")
          s = s.replace(
              line_v6,
              line_v6 + "        gScreen->port = 0; // explicit IPv6 bind: disable the IPv4 listener\n",
              1,
          )

          p.write_text(s)
          PY
          grep -q 'gScreen->ipv6port = 0;' src/trollvncserver.mm
          grep -q 'gScreen->port = 0;' src/trollvncserver.mm
          git diff --check
          git diff -- src/trollvncserver.mm

      - name: Build rootless package
        run: |
          set -euo pipefail
          source devkit/rootless.sh
          FINALPACKAGE=1 gmake clean package
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Record package hashes
        run: |
          set -euo pipefail
          shasum -a 256 packages/*.deb | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload rootless package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packages-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 7
